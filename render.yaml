services:
  - type: web
    name: spotify-genre-lab-api
    runtime: python
    plan: starter
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_PATH
        value: /var/data/spotify_lab.db
    disk:
      name: spotify-genre-lab-data
      mountPath: /var/data
      sizeGB: 1

  - type: web
    name: spotify-genre-lab-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE
        fromService:
          type: web
          name: spotify-genre-lab-api
          property: url
